<!DOCTYPE html>

  <head>
    <script>
      (function () {
        const stored = localStorage.getItem("theme");
        const preferred = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        document.documentElement.setAttribute("data-theme", stored || preferred);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Summit Journeys — Case study</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/global.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <link rel="stylesheet" href="../styles/layout.css" />
  </head>
  <body>
    <header>
      <nav class="layout-nav" aria-label="Primary navigation">

    <main class="layout-case-study-main layout-case-study-main--aol" aria-label="Summit Journeys case study">

        <a class="aol-case-nav__item" href="#summit-summary" data-case-nav-link>
          <span class="aol-case-nav__dot" aria-hidden="true"></span>

        <a class="aol-case-nav__item" href="#summit-problem" data-case-nav-link>
          <span class="aol-case-nav__dot" aria-hidden="true"></span>

        <a class="aol-case-nav__item" href="#summit-journey" data-case-nav-link>
          <span class="aol-case-nav__dot" aria-hidden="true"></span>

        </a>
        <a class="aol-case-nav__item" href="#summit-solutions" data-case-nav-link>

          <span class="aol-case-nav__label">Iterations &amp; Design</span>

        <a class="aol-case-nav__item" href="#summit-prototype" data-case-nav-link>
          <span class="aol-case-nav__dot" aria-hidden="true"></span>
          <span class="aol-case-nav__label">Prototype</span>
        </a>
        <a class="aol-case-nav__item" href="#summit-testing" data-case-nav-link>
          <span class="aol-case-nav__dot" aria-hidden="true"></span>
          <span class="aol-case-nav__label">Usability Testing</span>
        </a>
        <a class="aol-case-nav__item" href="#summit-insights" data-case-nav-link>
          <span class="aol-case-nav__dot" aria-hidden="true"></span>
          <span class="aol-case-nav__label">Insights</span>

        <a class="aol-case-nav__item" href="#summit-takeaways" data-case-nav-link>
          <span class="aol-case-nav__dot" aria-hidden="true"></span>

        </a>

      <a class="layout-case-study__back" href="../index.html#works">← Back to selected works</a>

      <article class="aol-case-study summit-case-study">
        <section class="summit-case-study__section" id="summit-summary">
          <img
            class="summit-case-study__section-image"
            src="../assets/images/summit-case/summary.png"
            alt="Summit Journeys summary section"
          />
        </section>

        <section class="summit-case-study__section" id="summit-problem">
          <img
            class="summit-case-study__section-image"
            src="../assets/images/summit-case/problem.png"
            alt="Summit Journeys problem section"
          />
        </section>

        <section class="summit-case-study__section" id="summit-journey">
          <img
            class="summit-case-study__section-image"
            src="../assets/images/summit-case/user-journey.png"
            alt="Summit Journeys user journey section"
          />
        </section>

        <section class="summit-case-study__section" id="summit-solutions">
          <img
            class="summit-case-study__section-image"
            src="../assets/images/summit-case/current-solution.png"
            alt="Summit Journeys current solutions section"
          />
        </section>

        <section class="summit-case-study__section" id="summit-iterations">
          <div class="summit-iterations">
            <img
              class="summit-case-study__section-image"
              src="../assets/images/summit-case/iterations-design.png"
              alt="Summit Journeys iterations and design section"
            />
            <div class="summit-iterations__lowfi" aria-label="Low-fidelity ideation sketches">
              <img
                class="summit-iterations__lowfi-image summit-iterations__lowfi-image--left"
                src="../assets/images/summit-case/iterations/lofi-left.png"
                alt="Low-fidelity ideation sketch left"
              />
              <img
                class="summit-iterations__lowfi-image summit-iterations__lowfi-image--middle"
                src="../assets/images/summit-case/iterations/lofi-middle.png"
                alt="Low-fidelity ideation sketch middle"
              />
              <img
                class="summit-iterations__lowfi-image summit-iterations__lowfi-image--right"
                src="../assets/images/summit-case/iterations/lofi-right.png"
                alt="Low-fidelity ideation sketch right"
              />
            </div>
            <div class="summit-iterations__midfi" aria-label="Mid-fidelity wireframes">
              <img
                class="summit-iterations__midfi-image summit-iterations__midfi-image--topleft"
                src="../assets/images/summit-case/iterations/midfi-topleft.png"
                alt="Mid-fidelity wireframe top left"
              />
              <img
                class="summit-iterations__midfi-image summit-iterations__midfi-image--bottomleft"
                src="../assets/images/summit-case/iterations/midfi-bottomleft.png"
                alt="Mid-fidelity wireframe bottom left"
              />
              <img
                class="summit-iterations__midfi-image summit-iterations__midfi-image--rightcolumn"
                src="../assets/images/summit-case/iterations/midfi-rightcolumn.png"
                alt="Mid-fidelity wireframe right column"
              />
            </div>
            <div class="summit-iterations__hifi-column">
              <img
                class="summit-iterations__hifi-image summit-iterations__hifi-image--one"
                src="../assets/images/summit-case/iterations/hifi-1.png"
                alt="High-fidelity design example showing the updated Summit Journeys header page"
              />
             <!-- <p class="summit-iterations__hifi-rationale">
                User testing indicated extreme difficulty surrounding the process of finding anything Summit
                Journeys had going on for the target market of young adults. I made three cards that streamlined
                this information front and center.
              </p>-->
              <img
                class="summit-iterations__hifi-image summit-iterations__hifi-image--two"
                src="../assets/images/summit-case/iterations/hifi-2-find-your-path.png"
                alt="Find Your Path section with Journeys, Adventures, and Summits cards"
              />
              <img
                class="summit-iterations__hifi-image summit-iterations__hifi-image--three"
                src="../assets/images/summit-case/iterations/hifi-3.1.png"
                alt="Summit Adventures high-fidelity mockup with map, activities list, and upcoming adventure cards"
              />
            </div>
          </div>
        </section>

        <section class="summit-case-study__section" id="summit-prototype">
          <div class="summit-prototype">
            <div class="summit-prototype__hero">
              <img
                class="summit-case-study__section-image summit-case-study__section-image--prototype-header"
                src="../assets/images/summit-case/prototype.png"
                alt="Summit Journeys prototype section header"
              />
              <div class="summit-logo-belt" aria-label="Summit logo concepts">
                <div class="summit-logo-belt__track">
                  <img src="../assets/images/summit-case/logos/logo-1.png" alt="Summit logo concept 1" />
                  <img src="../assets/images/summit-case/logos/logo-2.png" alt="Summit logo concept 2" />
                  <img src="../assets/images/summit-case/logos/logo-3.png" alt="Summit logo concept 3" />
                  <img src="../assets/images/summit-case/logos/logo-4.png" alt="Summit logo concept 4" />
                  <img src="../assets/images/summit-case/logos/logo-5.png" alt="Summit logo concept 5" />
                  <img src="../assets/images/summit-case/logos/logo-6.png" alt="Summit logo concept 6" />
                  <img src="../assets/images/summit-case/logos/logo-1.png" alt="" aria-hidden="true" />
                  <img src="../assets/images/summit-case/logos/logo-2.png" alt="" aria-hidden="true" />
                  <img src="../assets/images/summit-case/logos/logo-3.png" alt="" aria-hidden="true" />
                  <img src="../assets/images/summit-case/logos/logo-4.png" alt="" aria-hidden="true" />
                  <img src="../assets/images/summit-case/logos/logo-5.png" alt="" aria-hidden="true" />
                  <img src="../assets/images/summit-case/logos/logo-6.png" alt="" aria-hidden="true" />
                </div>
              </div>
            </div>
            <button
              class="summit-prototype__preview"
              type="button"
              data-prototype-open
              aria-label="Open larger Summit Journeys prototype"
            >
              <span class="summit-prototype__frame" aria-hidden="true">
                <iframe
                  title="Summit Journeys prototype preview"
                  src="https://embed.figma.com/proto/wy6cjPywI8W8MmvTHiV5eH/Summit-Journeys?page-id=36%3A2623&node-id=605-6992&viewport=-24471%2C-1534%2C0.22&scaling=scale-down&content-scaling=fixed&starting-point-node-id=605%3A6992&embed-host=share"
                  loading="lazy"
                  allowfullscreen
                ></iframe>
              </span>
            </button>
            <button class="summit-prototype__link" type="button" data-prototype-open>
              View Prototype
            </button>
          </div>
        </section>

        <section class="summit-case-study__section" id="summit-testing">
          <img
            class="summit-case-study__section-image"
            src="../assets/images/summit-case/testing.png"

          />

        <section class="summit-case-study__section" id="summit-insights">
          <img
            class="summit-case-study__section-image"
            src="../assets/images/summit-case/insights.png"

          />

        <section class="summit-case-study__section" id="summit-takeaways">

            src="../assets/images/summit-case/takeaway.png"
            alt="Summit Journeys takeaways and improvements section"

    <div class="summit-prototype-modal" data-prototype-modal hidden>
      <div class="summit-prototype-modal__backdrop" data-prototype-close></div>
      <div
        class="summit-prototype-modal__dialog"
        role="dialog"
        aria-modal="true"
        aria-label="Summit Journeys prototype"
      >
        <button
          class="summit-prototype-modal__close"
          type="button"
          data-prototype-close
          aria-label="Close prototype"
        >
          Close
        </button>
        <iframe
          title="Summit Journeys prototype"
          src="https://embed.figma.com/proto/wy6cjPywI8W8MmvTHiV5eH/Summit-Journeys?page-id=36%3A2623&node-id=605-6992&viewport=-24471%2C-1534%2C0.22&scaling=contain&content-scaling=fixed&starting-point-node-id=605%3A6992&embed-host=share"
          loading="lazy"
          allowfullscreen
        ></iframe>
      </div>
    </div>
